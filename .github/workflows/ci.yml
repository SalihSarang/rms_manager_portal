name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Manager Portal
        uses: actions/checkout@v4
        with:
          path: manager_portal

      - name: Checkout Shared Packages
        uses: actions/checkout@v4
        with:
          repository: SalihSarang/rms_packages
          path: packages

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Install Dependencies
        working-directory: manager_portal
        run: flutter pub get

      - name: Static Analysis
        working-directory: manager_portal
        run: flutter analyze

      - name: Run Tests
        working-directory: manager_portal
        run: flutter test