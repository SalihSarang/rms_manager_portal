name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Manager Portal
        uses: actions/checkout@v4
        with:
          path: manager_portal

      - name: Checkout Shared Packages
        uses: actions/checkout@v4
        with:
          repository: SalihSarang/rms_packages
          path: packages

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Install Dependencies
        working-directory: manager_portal
        run: flutter pub get

      - name: Static Analysis
        working-directory: manager_portal
        run: flutter analyze

      - name: Run Tests
        working-directory: manager_portal
        run: flutter test
  
  deploy:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Manager Portal
        uses: actions/checkout@v4
        with:
          path: manager_portal

      - name: Checkout Shared Packages
        uses: actions/checkout@v4
        with:
          repository: SalihSarang/rms_packages
          path: packages

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: manager_portal
        run: flutter pub get

      - name: Build Web
        working-directory: manager_portal
        run: flutter build web --build-number=${{ github.run_number }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMS_PROJECT }}
          projectId: rms-project-b8903
          channelId: live
          entryPoint: manager_portal
          target: rms-manager-portal