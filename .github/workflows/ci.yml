name: Flutter CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Manager Portal
        uses: actions/checkout@v4
        with:
          path: manager_portal

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          echo "### Flutter Version" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter --version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Install Dependencies
        working-directory: manager_portal
        run: flutter pub get

      - name: Static Analysis
        working-directory: manager_portal
        run: |
          flutter analyze 2>&1 | tee analyze_output.txt || {
            echo "### Flutter Analyze Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Tests
        working-directory: manager_portal
        run: |
          flutter test 2>&1 | tee test_output.txt || {
            echo "### Flutter Test Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
  
  deploy:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Manager Portal
        uses: actions/checkout@v4
        with:
          path: manager_portal

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: manager_portal
        run: flutter pub get

      - name: Build Web
        working-directory: manager_portal
        run: flutter build web --build-number=${{ github.run_number }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMS_PROJECT }}
          projectId: rms-project-b8903
          channelId: live
          entryPoint: manager_portal
          target: rms-manager-portal